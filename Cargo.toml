[package]
name = "dsh-superagent-rs"
version = "0.1.0"
edition = "2021"
description = "Rust port of the core of deepseek-ai/dsh-superagent-prototype: domain model, policy gate, engine, agent loop, and model providers (Muse Spark primary, DeepSeek deepseek-flash backup)"
license = "MIT"

[[bin]]
name = "dsh-superagent-rs"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha1 = "0.10"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls-native-roots", "json"] }

[dev-dependencies]
tempfile = "3"
